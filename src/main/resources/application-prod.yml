# Production profile: PostgreSQL with Flyway migrations. Swagger and the H2 console stay disabled.
# The database settings and JWT_SECRET are required environment variables, there are no defaults.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # The schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it matches.
      ddl-auto: validate

  flyway:
    enabled: true

logging:
  level:
    root: WARN
    com.claudiopaulo.userapp: INFO
    org.springframework.security: WARN

# Behind a trusted reverse proxy, let Spring resolve the real client address
# (used by the audit log). Do not enable this when clients can reach the app directly.
# server:
#   forward-headers-strategy: native
