# Production profile: Swagger and H2 console stay disabled (see application.yml).
# Replace the in-memory H2 datasource with a real database before deploying.
logging:
  level:
    root: WARN
    com.claudiopaulo.userapp: INFO
    org.springframework.security: WARN

# Behind a trusted reverse proxy, let Spring resolve the real client address
# (used by the audit log). Do not enable this when clients can reach the app directly.
# server:
#   forward-headers-strategy: native
