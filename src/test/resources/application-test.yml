spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        
  main:
    allow-bean-definition-overriding: true
  
  h2:
    console:
      enabled: false

jwt:
  secret: testSecretKeyForJwtTokenGenerationAndValidation123456789
  expiration: 3600000

app:
  version: 1.0.0

# Desabilitar Swagger nos testes
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

# Logging Configuration
logging:
  level:
    root: WARN
    com.claudiopaulo.userapp: DEBUG
    org.springframework: WARN